version: '3.9'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${db_name}
      POSTGRES_USER: ${db_user}
      POSTGRES_PASSWORD: ${db_pass}
    ports:
      - '5432:5432'

  redis:
    image: redis:latest
    ports:
      - '6379:6379'

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - '8000:8000'
    depends_on:
      - db
      - redis
    env_file:
      - .env.docker    

  celery:
    build: .
    command: celery -A core worker --loglevel=info
    depends_on:
      - db
      - redis
    env_file:
      - .env.docker
